
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBT SMAN 10 Toraja Utara</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#eef2f7;margin:0}
header{background:#153b65;color:white;text-align:center;padding:25px}
.card{background:white;max-width:420px;margin:35px auto;padding:25px;border-radius:12px}
input,button{width:100%;padding:13px;margin:9px 0;box-sizing:border-box}
input{border:1px solid #ccc;border-radius:6px}
button{background:#153b65;color:white;border:0;border-radius:6px;cursor:pointer}
#dashboard{display:none}
</style>
</head>
<body>
<header>
<h2>CBT SMAN 10 TORAJA UTARA</h2>
<p>Computer Based Test</p>
</header>

<div class="card" id="login">
<h3>LOGIN PENGGUNA</h3>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="loginUser()">MASUK</button>
<p id="pesan"></p>
</div>

<div class="card" id="dashboard">
<h3>Dashboard CBT</h3>
<p id="nama"></p>
<p id="role"></p>
<button onclick="logoutUser()">KELUAR</button>
</div>

<script>
const SUPABASE_URL = "https://snmftnlmkbwsrsgglxxq.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_2_6k7jT_-GsTu77JH7RwGA_mir3037E";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function loginUser(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const pesan=document.getElementById("pesan");
 pesan.textContent="Memeriksa akun...";

 const {data,error}=await db.auth.signInWithPassword({
   email,password
 });

 if(error){
   pesan.textContent="Login gagal: "+error.message;
   return;
 }

 const {data:profil,error:profilError}=await db
   .from("profiles")
   .select("nama_lengkap,role")
   .eq("id",data.user.id)
   .single();

 if(profilError || !profil){
   await db.auth.signOut();
   pesan.textContent="Profil pengguna belum tersedia.";
   return;
 }

 document.getElementById("login").style.display="none";
 document.getElementById("dashboard").style.display="block";
 document.getElementById("nama").textContent="Nama: "+profil.nama_lengkap;
 document.getElementById("role").textContent="Hak akses: "+profil.role;
}

async function logoutUser(){
 await db.auth.signOut();
 location.reload();
}
</script>
</body>
</html>
